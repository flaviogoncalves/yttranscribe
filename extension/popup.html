<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 system-ui, sans-serif;
      }
      h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .02em; }
      button {
        width: 100%;
        padding: 9px;
        font: inherit;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid rgba(128,128,128,.45);
        background: canvas;
        color: canvastext;
        cursor: pointer;
      }
      button:disabled { opacity: .55; cursor: default; }
      #status { margin-top: 10px; min-height: 1.4em; }
      .busy { opacity: .7; }
      .good { color: #167a3c; }
      .bad  { color: #b3261e; }
      @media (prefers-color-scheme: dark) {
        .good { color: #6ee7a0; }
        .bad  { color: #ff9b93; }
      }
      #details {
        margin-top: 10px;
        max-height: 260px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        opacity: .8;
      }
      #details:empty { display: none; }
    </style>
  </head>
  <body>
    <h1>yttranscribe</h1>
    <button id="grab">Copy transcript</button>
    <div id="status" class="idle">Open a YouTube video and click above.</div>
    <pre id="details"></pre>
    <script type="module" src="./js/extension/popup.js"></script>
  </body>
</html>
